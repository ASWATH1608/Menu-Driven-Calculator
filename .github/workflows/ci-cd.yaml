name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run automated tests
        run: |
          python -m unittest test_app.py

      - name: Generate unique image tag
        id: meta
        run: |
          echo "TAG=v-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.aswath1606 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.aswath1606 }}/python-calculator:${{ env.TAG }}

      - name: Set up Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|<IMAGE_TAG>|${{ env.TAG }}|g" k8s-deployment.yaml
          kubectl apply -f k8s-deployment.yaml
          kubectl rollout restart deployment/python-calculator
